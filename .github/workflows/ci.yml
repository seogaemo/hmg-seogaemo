name: CI
on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep PRERELEASE off main
        # PRERELEASE exists only on beta; a merge from beta (or a branch cut from it) must not reach main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          if [ -e PRERELEASE ]; then
            echo "::error::PRERELEASE must not exist on main; merge feature branches, never beta, into main"
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Test and package debug build
        # test depends on package; test exactly the artifacts built here.
        # A release tag on this commit reuses this run instead of repeating the suites.
        run: make test
