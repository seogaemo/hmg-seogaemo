name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on the right branch
        # Betas ship only from beta, finals only from main
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in *-beta.*) branch=beta;; *) branch=main;; esac
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::$tag points at $GITHUB_SHA, which is not contained in origin/$branch"
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Build and verify release package
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OTA_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.OTA_MANIFEST_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # VERSION, plus PRERELEASE (beta.N) for a beta, published as a prerelease that
          # OTA's releases/latest never offers
          version="$(python3 tools/version.py --label)"
          test "$tag" = "v$version"
          : "${RELEASE_KEYSTORE_B64:?missing release keystore}"
          : "${RELEASE_KEYSTORE_PASSWORD:?missing keystore password}"
          : "${RELEASE_KEY_ALIAS:?missing keystore alias}"
          : "${OTA_MANIFEST_PRIVATE_KEY_PEM:?missing manifest private key}"
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          chmod 700 "$secret_dir"
          echo "::add-mask::$secret_dir"
          export RELEASE_KEYSTORE="$secret_dir/release.p12"
          export OTA_MANIFEST_PRIVATE_KEY="$secret_dir/manifest.pem"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RELEASE_KEYSTORE"
          printf '%s' "$OTA_MANIFEST_PRIVATE_KEY_PEM" > "$OTA_MANIFEST_PRIVATE_KEY"
          chmod 600 "$RELEASE_KEYSTORE" "$OTA_MANIFEST_PRIVATE_KEY"
          unset RELEASE_KEYSTORE_B64 OTA_MANIFEST_PRIVATE_KEY_PEM
          make -j"$(nproc)" package
          make verify-dist
          actual_cert="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs --min-sdk-version 19 out/hmg-seogaemo.apk | awk '/certificate SHA-256 digest:/ {print $NF}')"
          test "$actual_cert" = '3a71c382c97598e17fbe688e9f1169a9575003749dd6b19ce87460cc5de1e853'
      - name: Wait for CI on this commit
        id: ci
        # Polls while CI tests the same commit (the build above overlaps it). Anything
        # but a successful run (cancelled, failed, never started, over 25 min) means the
        # full suite runs in the next step.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '.workflow_runs | if any(.conclusion == "success") then "success"
                    elif any(.status != "completed") then "pending" else "none" end')"
            echo "CI for $GITHUB_SHA: $state"
            if [ "$state" != pending ]; then break; fi
            sleep 15
          done
          echo "result=$state" >> "$GITHUB_OUTPUT"
      - name: Test the release package
        # Both run on the release-signed package already built and never rebuild it.
        # CI passed this commit: only the suites that read the package. Otherwise: all.
        run: make ${{ steps.ci.outputs.result == 'success' && 'test-dist' || 'test-suites' }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          lists="$(mktemp -d)"
          trap 'rm -rf "$lists"' EXIT
          prerelease=
          case "$tag" in *-beta.*) prerelease=--prerelease;; esac
          gh release create "$tag" --draft $prerelease --verify-tag out/dist/*
          find out/dist -maxdepth 1 -type f -printf '%f\n' | sort > "$lists/expected-assets"
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > "$lists/uploaded-assets"
          diff -u "$lists/expected-assets" "$lists/uploaded-assets"
          test "$(wc -l < "$lists/uploaded-assets")" -eq 7
          gh release edit "$tag" --draft=false
