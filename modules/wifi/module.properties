id=wifi
version=@VERSION@
api=1
cars=*.KOR.*
restart=head_unit
replaces=wifi-client
conflicts=leafia
rerun_on=boot,screen_on
icon=wifi
raw_shell=1
setting.1=builtin_role:choice(client|off|carplay_ap):client
setting.2=usb_role:choice(off|client|carplay_ap):off
owns_props=persist.wifi.state
owns_files=/system/etc/permissions/android.hardware.wifi.xml
kmods=88x2bu,8851bu
kmod.88x2bu.tcc803x=files/kmod/tcc803x/88x2bu.ko
kmod.88x2bu.tcc897x=files/kmod/tcc897x/88x2bu.ko
kmod.8851bu.tcc803x=files/kmod/tcc803x/8851bu.ko
kmod.8851bu.tcc897x=files/kmod/tcc897x/8851bu.ko
daemons=usb-wpa,usb-dhcp,usb-hostapd,usb-dnsmasq
daemon.usb-wpa=/system/bin/wpa_supplicant -irtwlan0 -Dnl80211 -c@state@/usb-wpa.conf
daemon.usb-dhcp=/system/bin/dhcpcd -B -L rtwlan0
daemon.usb-hostapd=/system/bin/hostapd @state@/usb-hostapd.conf
daemon_user.usb-hostapd=wifi
derived_bins=hostapd
derived_bin.hostapd=/system/bin/hostapd /data/misc/wifi/all_sta.list usb_sta.list
daemon.usb-dnsmasq=/system/bin/dnsmasq -k --no-resolv --bind-interfaces --interface=rtwlan0 --dhcp-range=192.168.50.10,192.168.50.99,12h --dhcp-leasefile=@state@/dhcp.leases --pid-file=@state@/dnsmasq.pid
owns_ifaces=rtwlan*
net_rules.1=iptables -t filter INPUT -i rtwlan0 -j ACCEPT
