id=user-button
version=@VERSION@
api=1
cars=*.KOR.*
restart=none
rerun_on=boot,screen_on
conflicts=hmgapi,leafia
icon=button
raw_shell=1
owns_props=persist.sys.key.custom,persist.sys.key.swrccustom
reassert_props=persist.sys.key.custom,persist.sys.key.swrccustom
setting.1=swrc:toggle:off
setting.2=head:toggle:off
replaces=user-button-head-unit,user-button-shortcut
replaces_setting.user-button-head-unit=head:on
replaces_setting.user-button-shortcut=swrc:on
